<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" fill="none" width="100%" height="100%">
  <defs>
    <clipPath id="tv-emblem-clip">
      <circle cx="90" cy="90" r="70" />
    </clipPath>
  </defs>

  <!-- === LEFT EMBLEM === -->
  <!-- Outer Ring Shadow / Base -->
  <circle cx="90" cy="90" r="72" fill="#08182b" />
  <!-- Outer Teal Border Ring -->
  <circle cx="90" cy="90" r="72" stroke="#00A896" stroke-width="7" fill="#08182b" />

  <!-- Inner Clipped Content -->
  <g clip-path="url(#tv-emblem-clip)">
    <!-- Deep Navy Sky -->
    <rect x="10" y="10" width="160" height="160" fill="#08182b" />

    <!-- Golden Sun in upper right -->
    <circle cx="128" cy="58" r="16" fill="#F59E0B" />

    <!-- Left Cyan Peak (Background facet) -->
    <polygon points="15,160 68,72 110,148" fill="#38BDF8" />
    <!-- Left Cyan Peak (Main facet) -->
    <polygon points="15,160 68,72 80,160" fill="#2DD4BF" />

    <!-- Right White Mountain Peak (Back facet) -->
    <polygon points="55,160 118,65 170,160" fill="#E2E8F0" />
    <!-- Right White Mountain Peak (Main face) -->
    <polygon points="55,160 118,65 118,160" fill="#FFFFFF" />

    <!-- Front Left Cyan Overlap Peak -->
    <polygon points="16,160 68,74 105,138 68,160" fill="#22D3EE" />

    <!-- Winding Golden Trail / Path -->
    <path
      d="M 94 110 C 102 118, 108 128, 102 140 C 96 150, 84 156, 84 168"
      fill="none"
      stroke="#F59E0B"
      stroke-width="6.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Bottom Teal Arc Accent -->
  <path
    d="M 56 154 C 74 163, 106 163, 124 154 C 112 165, 68 165, 56 154 Z"
    fill="#00A896"
  />

  <!-- === RIGHT LOGOTYPE === -->
  <!-- "TourVista" Text -->
  <g transform="translate(195, 78)">
    <text font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="-0.03em">
      <tspan fill="#08182b">Tour</tspan><tspan fill="#00A896">Vista</tspan>
    </text>
  </g>

  <!-- "EXPLORE BEYOND" Subtitle -->
  <g transform="translate(200, 114)">
    <text font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="14.5" letter-spacing="0.34em" fill="#334155">
      EXPLORE BEYOND
    </text>
  </g>

  <!-- Underline Swoosh -->
  <path
    d="M 198 135 Q 355 152 512 135"
    fill="none"
    stroke="#00A896"
    stroke-width="3.5"
    stroke-linecap="round"
  />
</svg>
